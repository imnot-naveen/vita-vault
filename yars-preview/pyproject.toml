[project]
name = "vita-vault-ingestion"
version = "0.1.0"
description = "Reddit ingestion pipeline for RAG systems"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
praw = ["praw>=8.0.0"]
yars = ["yars>=0.4.0"]
all = ["praw>=8.0.0", "yars>=0.4.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
